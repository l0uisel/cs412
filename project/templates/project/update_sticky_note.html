<!-- Description: Form to update sticky notes -->

<!-- Inherit structure and layout of base -->
{% extends 'project/base.html' %}

{% block content %}
<h1>📝 Edit Sticky Note</h1>
<!-- POST = send data -->
<form method="POST">
    {% csrf_token %}
    <table>
        <!-- Render form fields as table -->
        {{ form.as_table }}
    </table>
    <!-- Submit button to send form -->
    <input type="submit" value="Update Note ✏️" class="btn">
    <!-- Back to sticky notes list if cancel -->
    <div style="text-align: center;">
    <a href="{% url 'sticky_note_detail' note.pk %}" class="btn">Cancel</a></div>
</form>
{% endblock %}s
