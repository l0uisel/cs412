<!-- Description: Form to update diary entry -->

<!-- Inherit structure and layout of base -->
{% extends 'project/base.html' %}

{% block content %}
<h1>📔 Edit Diary Entry</h1>
<!-- POST = send data -->
<form method="POST">
    {% csrf_token %}
    <table>
        <!-- Render form fields as table -->
        {{ form.as_table }}
    </table>
    <!-- Submit button to send form -->
    <input type="submit" value="Update Entry ✏️" class="btn">
    <!-- Back to diary list if cancel -->
    <div style="text-align: center;">
    <a href="{% url 'diary_detail' entry.pk %}" class="btn">Cancel</a></div>
</form>
{% endblock %}
